# Production deployment — build locally with `bun run build`, then
# Caddy serves ./dist directly via a bind mount.
services:
  caddy:
    image: caddy:2-alpine
    container_name: random-kanji
    restart: unless-stopped
    # ports:
    #   - "80:80"
    volumes:
      - ${DIR}/dist:/srv:ro
      - ${DIR}/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - proxy # Traefik
      - internal # Stack-internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      #> external
      - "traefik.http.routers.${TNAME}.rule=Host(`kanji.mrmobi.dev`)"
      - "traefik.http.routers.${TNAME}.entrypoints=https-external"
      - "traefik.http.routers.${TNAME}.tls=true"
      - "traefik.http.routers.${TNAME}.service=${TNAME}"
      - "traefik.http.services.${TNAME}.loadbalancer.server.port=80"

volumes:
  caddy_data:
  caddy_config:

networks:
  proxy:
    external: true
  internal:
    external: false
